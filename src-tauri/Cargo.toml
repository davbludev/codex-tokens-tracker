[package]
name = "codex-tokens-tracker"
version = "0.1.0"
edition = "2021"

[lib]
name = "codex_tokens_tracker"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
notify = "8"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
sha2 = "0.10.9"
bigdecimal = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
